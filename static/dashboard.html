
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapiPOS Main Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen">
  <div class="absolute top-6 right-6">
  <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">🚪 Logout</button>
</div>
<div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md text-center">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">📋 SnapiPOS Dashboard</h1>
    <div class="flex flex-col gap-4 sm:flex-col">
      <a href="/inventory.html" class="block bg-blue-600 hover:bg-blue-700 text-white py-3 px-6 rounded text-xl">📦 Inventory</a>
      <a href="/sales.html" class="block bg-green-600 hover:bg-green-700 text-white py-3 px-6 rounded text-xl">💰 Sales</a>
    </div>
  </div>

<script>
  async function logout() {
    const res = await fetch('/logout', {
      method: 'POST',
      credentials: 'include'
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = "/";
    } else {
      alert("Logout failed");
    }
  }
</script>

</body>
</html>
